<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script src="main.js" type="module"></script>
</head>
<body>
    <div id="scrolly-1">
    <div id="scatter-story">some filler text here</div>
    <div id="scatter-plot">
        <div style="display: flex; align-items: baseline;">
        <label for="commit-progress">Show commits until:</label>
        <input type="range" id="commit-progress" min="0" max="100" value="100" style="margin-left: 1em;">
        <time id="commit-time" style="margin-left: auto;"></time>
        </div>
        <div id="stats"></div>
        <h2>Commits by time of day</h2>
        <div id="chart"></div>
        <dl id="language-breakdown" class="stats"></dl>
    </div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>
    <dt>Date</dt>
    <dd id="commit-date"></dd>
    <dt>Time</dt>
    <dd id="commit-time-tooltip"></dd>
    <dt>Author</dt>
    <dd id="commit-author"></dd>
    <dt>Lines</dt>
    <dd id="commit-lines"></dd>
    </dl>
    <dl id="files"></dl>
    <p id="selection-count">No commits selected</p>
</body>
</html>
